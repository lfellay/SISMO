# SISMO 2.0 configuration
#
# Run SISMO with:
#   sismo MODEL.osc.mod OUTPUT_BASE
#
# Copy this file into a work directory to keep settings with a calculation,
# or pass another file as the optional third positional argument.

# Requested degree and radial-order ranges.
l_min = 1
l_max = 2
g_min = 1
g_max = 108

# Physical treatment and optional output.
use_poisson = true
takata_closure = true
write_eigenfunctions = false

# Sturm scan and asymptotic frequency-window controls.
scan_points = 2000
eps_g = 2.5

# Split Poisson/Newton refinement controls.
max_iterations = 150
tolerance = 1.0e-8
inner_poisson_iterations = 1
poisson_relaxation = 0.4
poisson_inner_tolerance = 0.0
